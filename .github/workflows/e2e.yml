name: Release benchmark-operator container images
on:
  push:
    tags: "*"
  workflow_dispatch:
    inputs: 
      test_list:
        description: Space separated list of e2e tests to trigger
        required: true
        default: all
jobs:
  e2e:
    name: E2E testing
    runs-on: ubuntu-latest
    env:
      QUAY_USER: ${{ secrets.QUAY_USER }}
      QUAY_TOKEN: ${{ secrets.QUAY_TOKEN }}
    steps:

      - name: Print tests
        run: echo ${{ github.event.inputs.test_list }}!
